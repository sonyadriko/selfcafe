<style>
.sidebar-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-right: 12px;
    opacity: 0.7;
    transition: opacity 0.2s ease;
}

.sidebar-link:hover .sidebar-icon,
.sidebar-link.active .sidebar-icon {
    opacity: 1;
}

/* Mobile-only toggle button - inline because it's dynamic */
.mobile-menu-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    width: 44px;
    height: 44px;
    background: var(--color-ink-black);
    border: none;
    border-radius: var(--radius-md);
    color: var(--color-white);
    cursor: pointer;
    align-items: center;
    justify-content: center;
}

@media (max-width: 768px) {
    .mobile-menu-btn {
        display: flex;
    }

    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main-content {
        padding-top: 80px;
    }
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
</style>

<script>
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
</script>
